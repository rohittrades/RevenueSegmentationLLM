name: Revenue Segmentation LLM

on:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Execute Revenue Segmentation
        env:
          # Mapping your GitHub Secrets to Environment Variables
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GEMINI_PAID_KEY1: ${{ secrets.GEMINI_PAID_KEY1 }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
        run: |
            python llm_segmentation.py

